<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEVERDEADLINE — สมาชิกแก๊ง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#0a0a0b;--card:#151517;--card2:#1c1c1f;--line:#2b2b30;--tx:#d9dade;--mut:#9b9ca5;--red:#d7142a;--red2:#ff4b5e;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:Kanit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;will-change:transform;
  background:radial-gradient(circle at 50% 0,#2a0a10,transparent 40%),radial-gradient(circle at 80% 70%,#d7142a1a,transparent 45%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.1)}}
@keyframes in{from{opacity:0;transform:scale(.6) translateY(-20px)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes fade{from{opacity:0}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes glow{50%{opacity:.25}}
@keyframes fill{to{width:100%}}
@keyframes blink{from{opacity:.4}}
.logo{position:relative;display:inline-block;width:min(340px,80vw)}
.logo img{position:relative;display:block;width:100%;animation:in 1s cubic-bezier(.2,.8,.2,1) both,float 4s ease-in-out 1s infinite}
.logo i{position:absolute;inset:10% 5%;background:radial-gradient(closest-side,#d7142a99,transparent);filter:blur(18px);animation:glow 2.6s ease-in-out infinite}
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:26px;background:#050506;transition:opacity .6s,visibility .6s}
#loader.hide{opacity:0;visibility:hidden}
#loader .logo{width:min(320px,70vw)}
.bar3{width:min(260px,60vw);height:4px;border-radius:9px;background:#222;overflow:hidden}
.bar3 b{display:block;width:0;height:100%;background:linear-gradient(90deg,#8a0c1a,var(--red2));animation:fill 3s linear forwards}
.ld{font-size:13px;letter-spacing:.3em;color:var(--mut);animation:blink 1s infinite alternate}
header{text-align:center;padding:28px 16px 8px}
header h1{margin:6px 0 0;font-size:15px;font-weight:500;letter-spacing:.2em;color:var(--mut);animation:up .9s .4s both}
.badge{display:inline-block;margin:10px 8px 0 0;padding:3px 12px;font-size:12px;color:var(--red2);border:1px solid var(--red);border-radius:99px}
nav{position:sticky;top:env(safe-area-inset-top,0);z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 12px}
.tab{padding:8px 18px;font:inherit;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:99px;cursor:pointer;transition:transform .2s,background .2s,color .2s,box-shadow .2s}
.tab:hover{transform:translateY(-2px);color:#fff;border-color:var(--red)}
.tab.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 16px #d7142a88}
footer{padding:20px 16px 84px;text-align:center;font-size:13px;color:var(--mut)}
footer b{font-weight:500;letter-spacing:.2em;color:var(--red2);text-shadow:0 0 12px #d7142a99}
main{max-width:1000px;margin:0 auto;padding:8px 14px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pop .card{animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms)}
.card{position:relative;overflow:hidden;padding:16px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--red)}
.card:hover{transform:translateY(-5px);border-color:#d7142a88;box-shadow:0 10px 28px #d7142a28}
.rank{position:absolute;right:12px;top:8px;font-size:30px;color:#ffffff12}
.top{display:flex;gap:12px;align-items:center}
.av{flex:none;display:grid;place-items:center;width:64px;height:64px;overflow:hidden;font-size:24px;color:var(--red2);background:#2a2a2f;border:2px solid var(--red);border-radius:50%;object-fit:cover;transition:transform .3s}
.card:hover .av{transform:scale(1.08) rotate(-3deg)}
.name{font-size:18px;font-weight:500}
.tag{display:inline-block;margin-top:3px;padding:1px 10px;font-size:12px;color:#fff;background:#d7142a33;border:1px solid #d7142a77;border-radius:99px}
.dc{margin-top:2px;font-size:13px;color:#8e9bff}
.pic{display:block;width:100%;aspect-ratio:1;margin-bottom:10px;object-fit:cover;background:#222;border-radius:12px}
dl{margin:12px 0 0;font-size:14px}dt{margin-top:8px;font-size:12px;color:var(--mut)}dd{margin:0;white-space:pre-wrap;word-break:break-word}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
.bar,.ops,.row{display:flex;flex-wrap:wrap;gap:6px}
.bar{justify-content:center;margin:6px 0 16px}.ops{margin-top:12px}.row{justify-content:flex-end;margin-top:16px}
.grow{flex:1;align-self:center}
.btn{padding:6px 12px;font:inherit;font-size:13px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:transform .15s,border-color .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--red)}.btn:active{transform:scale(.95)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.danger{color:var(--red2);border-color:#d7142a66}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:14px;background:#000b;animation:fade .2s}
.box{width:min(460px,100%);max-height:90vh;overflow:auto;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;animation:up .3s}
.box h3{margin:0 0 10px;font-weight:500}
label{display:block;margin:10px 0 3px;font-size:12px;color:var(--mut)}
input,textarea{width:100%;padding:9px 11px;font:inherit;color:var(--tx);background:#0c0c0e;border:1px solid var(--line);border-radius:10px}
textarea{min-height:70px;resize:vertical}
#pl{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));z-index:30;display:flex;align-items:center;gap:6px;padding:6px 10px;background:#151517f2;border:1px solid var(--line);border-radius:99px}
#pl button{width:32px;height:32px;font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:50%;cursor:pointer;transition:border-color .2s}
#pl button:hover{border-color:var(--red)}
#pp.on{background:var(--red)!important;border-color:var(--red)!important}
#vol{min-width:34px;text-align:center;font-size:12px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="loader"><div class="logo"><i></i><img id="ldlogo" alt=""></div><div class="bar3"><b></b></div><div class="ld">LOADING</div></div>
<header>
  <div class="logo"><i></i><img id="logo" alt="logo"></div>
  <h1 id="tag"></h1>
  <div id="adm"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>สนับสนุนโดย <b>DIMOND STUDIO</b></footer>
<audio id="bgm" loop preload="auto"></audio>
<div id="pl"><button id="pp" title="เปิด/ปิดเพลง">▶</button><button id="vm" title="ลดเสียง">−</button><span id="vol"></span><button id="vp" title="เพิ่มเสียง">+</button></div>
<script>
const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    k.startsWith('on') ? el.addEventListener(k.slice(2), v) : el.setAttribute(k, v);
  }
  el.append(...kids.flat(Infinity).filter(x => x != null && x !== false));
  return el;
};
const mem = {};
const makeStore = kind => ({
  get: k => { try { return window[kind].getItem(k); } catch { return mem[kind + k] ?? null; } },
  set: (k, v) => { try { window[kind].setItem(k, v); return true; } catch { mem[kind + k] = String(v); return false; } },
  del: k => { try { window[kind].removeItem(k); } catch {} delete mem[kind + k]; },
});
const local = makeStore('localStorage'), session = makeStore('sessionStorage');
addEventListener('error', e => {
  $('#loader')?.remove();
  document.body.append(h('pre', { style: 'position:fixed;left:8px;right:8px;top:8px;z-index:200;margin:0;padding:10px;font-size:12px;white-space:pre-wrap;color:#fff;background:#8a0c1a;border-radius:10px' }, 'Error: ' + e.message + ' (บรรทัด ' + e.lineno + ')'));
});
function dialog(text, { input = false, type = 'text', value = '', cancel = true } = {}) {
  return new Promise(done => {
    const field = input && h('input', { type, value });
    const close = v => { modal.remove(); done(v); };
    const modal = h('div', { class: 'modal', style: 'z-index:60' }, h('div', { class: 'box' },
      h('div', {}, text), field,
      h('div', { class: 'row' },
        cancel && h('button', { class: 'btn', onclick: () => close(input ? null : false) }, 'ยกเลิก'),
        h('button', { class: 'btn red', onclick: () => close(input ? field.value : true) }, 'ตกลง'))));
    document.body.append(modal);
    if (field) { field.focus(); field.addEventListener('keydown', e => e.key === 'Enter' && close(field.value)); }
  });
}
const ask = (text, opt) => dialog(text, { input: true, ...opt });   // ถามข้อความ → ได้ข้อความ หรือ null
const sure = text => dialog(text);                                   // ถามยืนยัน → true / false
const tell = text => dialog(text, { cancel: false });                // แจ้งเตือน
const uid = () => Math.random().toString(36).slice(2, 9);
const KEY = 'neverdeadline';
const API = 'https://dubfun024.k81365114.workers.dev';
const DEFAULT_CATS = [
  { id: 'members', name: 'สมาชิก', type: 'members' },
  { id: 'outfits', name: 'ชุด เสื้อผ้า', type: 'gallery' },
  { id: 'memories', name: 'ความทรงจำ', type: 'gallery' },
];
const blank = () => ({ site: {}, cats: DEFAULT_CATS, members: [], gallery: [] });
let data;
try { data = { ...blank(), ...JSON.parse(local.get(KEY)) }; } catch { data = blank(); }
if (!data.memoriesAdded) {
  if (!data.cats.some(c => c.id === 'memories')) data.cats = [...data.cats, { id: 'memories', name: 'ความทรงจำ', type: 'gallery' }];
  data.memoriesAdded = true;
}
let cat = data.cats[0]?.id;                // หมวดที่เปิดอยู่
let admin = false;                         // เป็นแอดมินเมื่อรหัสผ่านถูกต้อง (ตรวจกับ Worker)
let animate = true;                        // เล่นอนิเมชั่นการ์ดเฉพาะตอนเปิดหน้า/เปลี่ยนหมวด
const mine = new Set();                    // เวอร์ชันที่เราเขียนเอง (กันรับข้อมูลสะท้อนกลับมาทับ)
let pass = session.get('nd_pass') || '';   // รหัสหลังบ้าน (เก็บแค่ในแท็บนี้)
let serverEmpty = false, queue = Promise.resolve();
const api = (path, opt = {}) => fetch(API + path, {
  cache: 'no-store', ...opt,
  headers: { 'x-pass': encodeURIComponent(pass), 'content-type': 'application/json' },
});
function save() {
  data.v = uid() + Date.now(); mine.add(data.v);
  const body = JSON.stringify(data);
  local.set(KEY, body);                    // แคชในเครื่อง
  if (!API) tell('ยังไม่ได้ตั้งค่า API — ข้อมูลเห็นแค่ในเครื่องนี้');
  else if (admin) queue = queue.then(() => push(body));   // ส่งทีละอัน เรียงลำดับ
  draw();
}
async function push(body) {
  try {
    const r = await api('/save', { method: 'POST', body });
    if (r.status === 401) { logout(); tell('รหัสหลังบ้านไม่ถูกต้อง กรุณาเข้าใหม่'); }
    else if (!r.ok) throw new Error('HTTP ' + r.status);
  } catch (e) { tell('บันทึกขึ้นเซิร์ฟเวอร์ไม่ได้: ' + e.message); }
}
async function pull() {
  try {
    const r = await fetch(API + '/data', { cache: 'no-store' });
    if (!r.ok) return;
    const t = await r.text();
    serverEmpty = !t;
    if (!t) return;
    const v = JSON.parse(t);
    if (!v || mine.has(v.v) || v.v === data.v) return;
    data = { ...blank(), ...v };
    local.set(KEY, JSON.stringify(data));
    draw();
    if ((data.site.music || '') !== curMusic) { loadMusic(); if (musicOn()) play().then(refreshPlayer); }
  } catch (e) { console.warn(e); }
}
let ws, tries = 0;
function connect() {
  try { ws = new WebSocket(API.replace(/^http/, 'ws') + '/ws'); } catch { return; }
  ws.onopen = () => { tries = 0; pull(); };
  ws.onmessage = () => pull();
  ws.onclose = () => setTimeout(connect, Math.min(30000, 1000 * 2 ** tries++));   // หลุดแล้วต่อใหม่อัตโนมัติ
}
async function cloudInit() {
  if (!API) return;
  if (pass) {                              // กู้สถานะแอดมินหลังรีเฟรช
    try { const r = await api('/auth', { method: 'POST' }); if (r.ok) { admin = true; draw(); } else logout(); } catch {}
  }
  await pull();
  connect();
  setInterval(() => ws?.readyState === 1 && ws.send('ping'), 30000);            // กันการเชื่อมต่อหลุดเงียบ ๆ
  document.addEventListener('visibilitychange', () => !document.hidden && pull());   // กลับมาเปิดแท็บ → รีเฟรชข้อมูล
}
const toImage = file => new Promise((ok, no) => {
  const r = new FileReader();
  r.onerror = no;
  r.onload = () => {
    const img = new Image();
    img.onerror = no;
    img.onload = () => {
      const k = Math.min(1, 600 / Math.max(img.width, img.height));
      const c = h('canvas', { width: Math.round(img.width * k), height: Math.round(img.height * k) });
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', .82));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});
const MEMBER_FIELDS = [
  { key: 'name', label: 'ชื่อ' },
  { key: 'age', label: 'อายุ', type: 'number' },
  { key: 'pos', label: 'ตำแหน่งการเล่น' },
  { key: 'discord', label: 'Discord (ชื่อ / ลิงก์โปรไฟล์)' },
  { key: 'avatar', label: 'รูปโปรไฟล์ Discord (อัปโหลด)', type: 'file' },
  { key: 'contact', label: 'ช่องทางติดต่อ', type: 'area' },
  { key: 'works', label: 'ผลงาน', type: 'area' },
];
const ITEM_FIELDS = [
  { key: 'title', label: 'ชื่อ / หัวข้อ' },
  { key: 'img', label: 'รูป', type: 'file' },
  { key: 'desc', label: 'รายละเอียด', type: 'area' },
];
const SITE_FIELDS = [
  { key: 'name', label: 'ชื่อแก๊ง' },
  { key: 'tagline', label: 'คำโปรย' },
  { key: 'logo', label: 'โลโก้ (อัปโหลดใหม่)', type: 'file' },
];
function form(title, fields, item, onSave) {
  const inputs = {};
  const box = h('div', { class: 'box' }, h('h3', {}, title));
  const modal = h('div', { class: 'modal' }, box);
  for (const f of fields) {
    const el = f.type === 'area' ? h('textarea')
      : h('input', { type: f.type || 'text', accept: f.type === 'file' ? 'image/*' : null });
    if (f.type !== 'file') el.value = item[f.key] ?? '';
    inputs[f.key] = el;
    box.append(h('label', {}, f.label), el);
  }
  const ok = h('button', { class: 'btn red', onclick: async () => {
    ok.disabled = true;
    const out = { ...item };
    try {
      for (const f of fields) {
        const el = inputs[f.key];
        if (f.type === 'file') { if (el.files[0]) out[f.key] = await toImage(el.files[0]); }
        else out[f.key] = f.type === 'number' && el.value !== '' ? +el.value : el.value.trim();
      }
    } catch { tell('อ่านรูปไม่ได้'); ok.disabled = false; return; }
    modal.remove();
    onSave(out);
  } }, 'บันทึก');
  box.append(h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => modal.remove() }, 'ยกเลิก'), ok));
  document.body.append(modal);
}
function move(item, type, dir) {           // สลับลำดับกับคนข้าง ๆ
  const all = data[type];
  const group = type === 'members' ? all : all.filter(x => x.cat === cat);
  const other = group[group.indexOf(item) + dir];
  if (!other) return;
  const a = all.indexOf(item), b = all.indexOf(other);
  [all[a], all[b]] = [all[b], all[a]];
  save();
}
async function remove(item, type) {
  if (await sure('ยืนยันการลบ?')) { data[type] = data[type].filter(x => x !== item); save(); }
}
async function login() {
  if (!API) return tell('ยังไม่ได้ตั้งค่า API (ใส่ URL ของ Worker ที่ตัวแปร API)');
  const p = await ask('รหัสหลังบ้าน', { type: 'password' });
  if (p === null) return;
  pass = p;
  try {
    const r = await api('/auth', { method: 'POST' });
    if (!r.ok) { pass = ''; return tell('รหัสไม่ถูกต้อง'); }
    session.set('nd_pass', p); admin = true; draw();
    if (serverEmpty) save();                 // เซิร์ฟเวอร์ยังว่าง → ดันข้อมูลในเครื่องขึ้นไปครั้งแรก
  } catch { pass = ''; tell('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
}
let taps = 0, tapTimer;
function logoTap() {
  if (admin) return;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => taps = 0, 2000);
  if (++taps >= 5) { taps = 0; login(); }
}
function logout() { pass = ''; session.del('nd_pass'); admin = false; draw(); }
function exportData() {
  h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(data)])), download: 'neverdeadline-data.json' }).click();
}
function importData() {
  const f = h('input', { type: 'file', accept: '.json', onchange: async () => {
    try { data = { ...blank(), ...JSON.parse(await f.files[0].text()) }; save(); }
    catch { tell('ไฟล์ไม่ถูกต้อง'); }
  } });
  f.click();
}
function manageCats() {                    // popup จัดการหมวดหมู่
  const box = h('div', { class: 'box' });
  const modal = h('div', { class: 'modal' }, box);
  const change = fn => { fn(); save(); paint(); };
  const add = async (type, question) => { const n = await ask(question); if (n) change(() => data.cats.push({ id: uid(), name: n, type })); };
  function paint() {
    box.replaceChildren(
      h('h3', {}, 'จัดการหมวดหมู่'),
      ...data.cats.map((c, i) => h('div', { class: 'ops' },
        h('span', { class: 'grow' }, c.name + (c.type === 'members' ? ' (สมาชิก)' : ' (แกลเลอรี่)')),
        h('button', { class: 'btn', onclick: async () => { const n = await ask('ชื่อใหม่', { value: c.name }); if (n) change(() => c.name = n); } }, 'เปลี่ยนชื่อ'),
        h('button', { class: 'btn', onclick: () => i && change(() => [data.cats[i - 1], data.cats[i]] = [data.cats[i], data.cats[i - 1]]) }, '▲'),
        h('button', { class: 'btn danger', onclick: async () => (await sure('ลบหมวดนี้?')) && change(() => data.cats.splice(i, 1)) }, 'ลบ'),
      )),
      h('div', { class: 'ops' },
        h('button', { class: 'btn red', onclick: () => add('gallery', 'ชื่อหมวดรูปใหม่') }, '+ หมวดรูป'),
        h('button', { class: 'btn red', onclick: () => add('members', 'ชื่อหมวดสมาชิกใหม่') }, '+ หมวดสมาชิก')),
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => modal.remove() }, 'ปิด')),
    );
  }
  paint();
  document.body.append(modal);
}
const info = (label, val) => val ? [label && h('dt', {}, label), h('dd', {}, val)] : '';
function card(item, i, type) {
  const isMember = type === 'members';
  const fields = isMember ? MEMBER_FIELDS : ITEM_FIELDS;
  const head = isMember
    ? h('div', { class: 'top' },
        item.avatar ? h('img', { class: 'av', src: item.avatar, alt: '', loading: 'lazy', decoding: 'async' })
                    : h('div', { class: 'av' }, (item.name || '?')[0]),
        h('div', {},
          h('div', { class: 'name' }, item.name || '-'),
          item.pos && h('span', { class: 'tag' }, item.pos),
